apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meu-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alewebcode/teste-gitops.git
    targetRevision: main
    path: apps/meu-app
  destination:
    server: https://kubernetes.default.svc
    namespace: meu-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
